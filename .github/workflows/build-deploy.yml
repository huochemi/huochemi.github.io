name: Build & deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REACT_APP_AMAP_API_KEY: ${{ secrets.REACT_APP_AMAP_API_KEY }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # sharp@0.35.4 要求 node >= 20.9.0；低版本下 npm 会静默跳过其平台二进制，
      # 使 require('sharp') 在 CI 抛错 —— 见 docs/plans/2026-10-06-ci-red-node18-sharp-optional-skip.md
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install NPM packages
        run: npm install

      # CLI 单测（test/gps-sign.test.js 等）用 exiftool 现造 fixture，ubuntu runner 未预装
      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      # 照片管线 / fix-gps 的口径契约测试（与上面 CRA 的 npm test 互不干扰）
      - name: Run CLI tests
        run: npm run test:cli

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v7
        with:
          name: production-files
          path: ./build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: production-files
          path: ./build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
